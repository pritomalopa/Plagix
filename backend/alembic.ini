# A generic, single database configuration.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://plagix_user:plagix_dev_password@db:5432/plagix_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_class]

[handler_console]
class = StreamHandler
args = (sys.stderr)
level = NOTSET
formatter = generic

[formatter_format]

[formatter_generic]
format = %(levelname)-5.5s [%(asctime)s] %(name)s: %(message)s
datefmt = %H:%M:%S
