services:
  db:
    image: postgres:16-alpine
    container_name: plagix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plagix_user
      POSTGRES_PASSWORD: plagix_dev_password
      POSTGRES_DB: plagix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plagix_user -d plagix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plagix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plagix_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://plagix_user:plagix_dev_password@db:5432/plagix_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretdevkeyforplagix123456789
      - APP_ENV=development
    volumes:
      - ./backend/storage:/app/storage
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plagix_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg://plagix_user:plagix_dev_password@db:5432/plagix_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretdevkeyforplagix123456789
      - APP_ENV=development
    volumes:
      - ./backend/storage:/app/storage
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plagix_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
