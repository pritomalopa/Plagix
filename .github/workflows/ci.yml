name: PLAGIX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plagix_user
          POSTGRES_PASSWORD: plagix_dev_password
          POSTGRES_DB: plagix_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest httpx pytest-asyncio python-multipart
      - name: Run Pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://plagix_user:plagix_dev_password@localhost:5432/plagix_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: testsecretkeyci
        run: python -m pytest
